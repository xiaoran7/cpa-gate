name: Feature request
description: Propose a capability, integration, or behavior change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        cpa-gate deliberately keeps a narrow boundary: CPA owns credentials and
        provider OAuth; cpa-gate owns tenant keys, quotas, resilience, accounting,
        and the dashboard. Proposals that belong to the upstream project are
        better filed there.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the real workflow that is blocked or painful today.
      placeholder: "We need a monthly quota per key, not only a daily one."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should cpa-gate do? Include configuration or API shape if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other tools that solve this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Quota / rate limiting
        - Transport guard / retries / streaming
        - CPA management proxy
        - Accounting / SQLite / outbox
        - Dashboard (Aozora UI)
        - Provider quota integration
        - Deployment / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions first.
          required: true
        - label: This request belongs to cpa-gate rather than the upstream CLIProxyAPI project.
          required: true
